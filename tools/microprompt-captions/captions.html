<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicroPrompt</title>
<style>
  /* Options come from the URL, e.g. /?size=72&lines=2&align=left&transparent=1
     size      font size in px (default 56)
     lines     visible lines (default: the whole session, scrollable)
     align     center | left (default center)
     position  bottom | top | middle (default bottom)
     width     max width of the text block, in % of the window (default 90)
     fg, dim, bg   text, tentative-word, and background colors (CSS; # as %23)
     font      font family (default system UI)
     weight    font weight (default 600)
     transparent=1  transparent background with an outline, for OBS
     status=1  show the status line (hidden by default)
     With speakers (captions.py --speakers), each turn starts a new line
     under its speaker's name:
     who=0     hide the names (colours still tell turns apart with tint=1)
     tint=1    colour each turn's text with its speaker's colour */
  :root {
    --size: 56px;
    --lines: 3;
    --fg: #ffffff;
    --dim: #8f9ba8;
    --bg: #000000;
    --width: 90vw;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --weight: 600;
    --line: 1.25;
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }
  body.top { justify-content: flex-start; }
  body.middle { justify-content: center; }
  body.transparent { background: transparent; }
  body.transparent #text {
    text-shadow: 0 0 6px #000, 0 0 2px #000, 2px 2px 3px #000;
  }
  #frame {
    box-sizing: border-box;
    width: var(--width);
    padding: 3vh 0;
  }
  /* A window of exactly N lines; the text sits at its bottom, so older
     lines leave through the top as new words arrive. */
  #window {
    height: calc(var(--size) * var(--line) * var(--lines));
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    /* The line leaving through the top fades out instead of showing a cut
       sliver of its descenders or its shadow. */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 calc(var(--size) * 0.18));
    mask-image: linear-gradient(to bottom, transparent 0, #000 calc(var(--size) * 0.18));
  }
  /* Default (no lines=N): the window fills the screen and keeps the whole session;
     scroll up to read back, and it follows new text again at the bottom.
     margin-top:auto (not justify-content) keeps the top reachable. */
  body.all #frame { height: 100%; display: flex; flex-direction: column; padding-top: 36px; }
  body.all.nostatus #frame { padding-top: 3vh; }
  body.all #window {
    flex: 1;
    height: auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-mask-image: none;
    mask-image: none;
  }
  body.all #text { margin-top: auto; }
  #text {
    font-size: var(--size);
    font-weight: var(--weight);
    line-height: var(--line);
    text-align: center;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  body.left #text { text-align: left; }
  .done { opacity: 0.78; }
  .tentative { color: var(--dim); }
  .turn { display: block; }
  .who {
    font-size: 0.58em;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-right: 0.45em;
    vertical-align: 0.16em;
  }
  body.nowho .who { display: none; }
  #status {
    position: fixed;
    top: 10px;
    left: 14px;
    font: 500 13px/1.3 var(--font);
    color: var(--dim);
    opacity: 0.85;
    letter-spacing: 0.01em;
  }
  #status .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    background: #6b7280;
    vertical-align: 1px;
  }
  #status.live .dot { background: #ef4444; animation: pulse 1.6s ease-in-out infinite; }
  #status.error { color: #fca5a5; }
  body.nostatus #status { display: none; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { #status.live .dot { animation: none; } }
</style>
</head>
<body>
<div id="status"><span class="dot"></span><span id="status-text">conectando…</span></div>
<div id="frame"><div id="window"><div id="text" aria-live="polite"></div></div></div>
<script>
  "use strict";
  const params = new URLSearchParams(location.search);
  const root = document.documentElement.style;
  const number = (name, min, max) => {
    const value = Number(params.get(name));
    return Number.isFinite(value) && value >= min && value <= max ? value : null;
  };
  const size = number("size", 8, 400);
  if (size) root.setProperty("--size", size + "px");
  const lines = number("lines", 1, 20);
  if (lines) root.setProperty("--lines", String(lines));
  // The whole session, scrolling, unless a number of lines is asked for.
  const all = !lines;
  if (all) document.body.classList.add("all");
  const width = number("width", 10, 100);
  if (width) root.setProperty("--width", width + "vw");
  const weight = number("weight", 100, 900);
  if (weight) root.setProperty("--weight", String(weight));
  for (const name of ["fg", "dim", "bg"]) {
    const value = params.get(name);
    if (value && CSS.supports("color", value)) root.setProperty("--" + name, value);
  }
  if (params.get("font")) root.setProperty("--font", params.get("font"));
  if (params.get("align") === "left") document.body.classList.add("left");
  const position = params.get("position");
  if (position === "top" || position === "middle") document.body.classList.add(position);
  if (params.get("transparent") === "1") document.body.classList.add("transparent");
  if (params.get("status") !== "1") document.body.classList.add("nostatus");
  if (params.get("who") === "0") document.body.classList.add("nowho");
  const tint = params.get("tint") === "1";
  // One colour per speaker number, readable on a dark background.
  const PALETTE = ["#7dd3fc", "#fca5a5", "#86efac", "#fcd34d", "#c4b5fd", "#f9a8d4", "#fdba74", "#5eead4"];
  const colour = (speaker) => PALETTE[(speaker - 1) % PALETTE.length];

  const text = document.getElementById("text");
  const status = document.getElementById("status");
  const statusText = document.getElementById("status-text");

  function span(className, content) {
    const node = document.createElement("span");
    node.className = className;
    node.textContent = content;
    return node;
  }

  // The line being spoken: its fixed words, then its provisional ones.
  function live(state, after) {
    const nodes = [];
    const stable = state.stable.trim();
    if (stable) nodes.push(span("stable", (after ? " " : "") + stable));
    const tentative = state.tentative.trim();
    if (tentative) nodes.push(span("tentative", (after || stable ? " " : "") + tentative));
    return nodes;
  }

  // One block per turn: consecutive lines of the same speaker share it. A
  // line whose speaker isn't known yet stays with the turn before it.
  function turns(state) {
    const blocks = [];
    const open = (speaker, name) => {
      const block = { speaker, name, nodes: [] };
      blocks.push(block);
      return block;
    };
    let current = null;
    for (const line of state.lines) {
      if (!current || (line.speaker != null && line.speaker !== current.speaker)) {
        current = open(line.speaker, line.name);
      } else if (current.speaker == null && line.speaker != null) {
        current.speaker = line.speaker;
        current.name = line.name;
      }
      current.nodes.push(span("done", (current.nodes.length ? " " : "") + line.text.trim()));
    }
    if (state.stable.trim() || state.tentative.trim()) {
      if (!current || (state.speaker != null && state.speaker !== current.speaker)) {
        current = open(state.speaker, state.name);
      }
      current.nodes.push(...live(state, current.nodes.length > 0));
    }
    return blocks.map((block) => {
      const node = document.createElement("span");
      node.className = "turn";
      if (block.speaker != null) {
        const who = span("who", block.name || "");
        who.style.color = colour(block.speaker);
        node.append(who);
        if (tint) node.style.color = colour(block.speaker);
      }
      node.append(...block.nodes);
      return node;
    });
  }

  const win = document.getElementById("window");

  function render(state) {
    // Follow new text only while the reader is at the bottom.
    const atBottom = win.scrollHeight - win.scrollTop - win.clientHeight < 40;
    paint(state);
    if (all && atBottom) win.scrollTop = win.scrollHeight;
  }

  function paint(state) {
    const lines = state.lines.map((line) => (typeof line === "string" ? { text: line } : line));
    state = { ...state, lines };
    if ((state.info || {}).speakers) {
      text.replaceChildren(...turns(state));
    } else {
      const done = lines.map((line) => line.text.trim()).join(" ");
      text.replaceChildren(...(done ? [span("done", done)] : []), ...live(state, Boolean(done)));
    }

    const info = state.info || {};
    const parts = [state.status];
    if (info.model) parts.push(info.model);
    if (info.language) parts.push(info.language);
    if (info.partials === false) parts.push("sin parciales");
    if (state.error) parts.push(state.error);
    statusText.textContent = parts.join(" · ");
    status.classList.toggle("live", state.status === "en vivo");
    status.classList.toggle("error", state.status === "error");
  }

  function connect() {
    const source = new EventSource("/captions");
    source.onmessage = (message) => render(JSON.parse(message.data));
    source.onerror = () => {
      statusText.textContent = "sin conexión con captions.py…";
      status.classList.remove("live");
    };
  }
  connect();
</script>
</body>
</html>
